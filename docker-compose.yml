services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-khunmaeju}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khunmaeju}
      POSTGRES_DB: ${POSTGRES_DB:-khunmaeju}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only reachable from this machine (for `npm run dev`), never from the internet.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-khunmaeju} -d ${POSTGRES_DB:-khunmaeju}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-khunmaeju}:${POSTGRES_PASSWORD:-khunmaeju}@postgres:5432/${POSTGRES_DB:-khunmaeju}
      MEDIA_DIR: /app/media
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
