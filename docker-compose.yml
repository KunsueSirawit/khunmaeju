services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    restart: unless-stopped
    # DATABASE_URL comes from .env (MongoDB Atlas by default).
    env_file:
      - .env
    environment:
      MEDIA_DIR: /app/media
    ports:
      - '3000:3000'
    volumes:
      - media:/app/media

  # Optional self-hosted MongoDB instead of Atlas: `docker compose --profile local-db up -d`
  # and set DATABASE_URL=mongodb://mongo:27017/khunmaeju?replicaSet=rs0 (from the app container)
  # or mongodb://127.0.0.1:27017/khunmaeju?directConnection=true (from `npm run dev`).
  # Single-node replica set, because Payload uses transactions.
  mongo:
    image: mongo:8
    profiles: ['local-db']
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongodata:/data/db
    # Only reachable from this machine, never from the internet.
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      # Initiates the replica set on first start, then just reports its status.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  media:
  mongodata:
